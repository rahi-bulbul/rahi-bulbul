<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1744" viewBox="0 0 1200 1744">
<defs><pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#1A3858"/></pattern>
<pattern id="G" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="url(#g)"/><path d="M80 0H0V80" fill="none" stroke="#2B4A6B"/></pattern></defs>
<style>.s{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;fill:#EEF3F8}.m{font-family:'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#8FA9C2;font-size:13px}.mp{font-family:'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#EEF3F8;font-size:14px}.a{fill:#F2B84B}
.rel{stroke-dasharray:600;stroke-dashoffset:600;animation:d 1.4s .4s ease-out forwards}@keyframes d{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rel{animation:none;stroke-dashoffset:0}}</style>
<rect width="1200" height="1744" rx="10" fill="#0F2A44"/><rect x="12" y="12" width="1176" height="1720" fill="url(#G)" opacity=".9"/>
<rect x="12" y="12" width="1176" height="1720" fill="none" stroke="#8FA9C2" stroke-opacity=".55"/>
<text x="58" y="100" class="m">rahibulbul.com</text>
<text x="54" y="200" class="s" font-size="104" letter-spacing="-2">Rahi Bulbul</text>
<g class="rel" stroke="#F2B84B" stroke-width="1.5" fill="none"><path d="M58 228V244M628 228V244M58 236H628"/></g>
<text x="343" y="262" text-anchor="middle" class="m">full stack and AI engineer</text>
<text x="58" y="316" class="s" font-size="26">I build the system underneath the website:</text>
<text x="58" y="352" class="s" font-size="26" font-style="italic">quoting, booking, payments, dispatch, reporting.</text>
<text x="1144" y="100" text-anchor="end" class="m">dhaka, working remotely worldwide</text>
<text x="1010" y="122" text-anchor="end" class="m">currently building</text><text x="1144" y="122" text-anchor="end" class="m a">mop pop services</text><path d="M56 430H1144" stroke="#8FA9C2" stroke-opacity=".5"/><text x="56" y="482" class="s" font-size="32">Shipped</text><text x="58" y="508" class="m">two live systems, both built and run by one engineer</text><g transform="translate(56,538)"><rect width="532" height="330" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="24" y="36" class="m">business systems, sydney</text><text x="22" y="80" class="s" font-size="34">Mop Pop Services</text><text x="24" y="118" class="s" font-size="18" fill-opacity=".9">Operations platform for a home-services</text><text x="24" y="144" class="s" font-size="18" fill-opacity=".9">company: instant quoting, booking engine,</text><text x="24" y="170" class="s" font-size="18" fill-opacity=".9">membership club, three role-based portals.</text><path d="M24 210H168" stroke="#F2B84B" stroke-width="2"/><text x="24" y="248" class="s a" font-size="32">3</text><text x="24" y="270" class="m">portals</text><path d="M188 210H332" stroke="#F2B84B" stroke-width="2"/><text x="188" y="248" class="s a" font-size="32">&lt;60s</text><text x="188" y="270" class="m">quote to booking</text><path d="M352 210H496" stroke="#F2B84B" stroke-width="2"/><text x="352" y="248" class="s a" font-size="32">24/7</text><text x="352" y="270" class="m">self-serve</text><path d="M0 290H532" stroke="#8FA9C2" stroke-opacity=".4"/><text x="24" y="314" class="m">Next.js, TS, Node, MySQL, Stripe</text><text x="508" y="314" text-anchor="end" class="mp">moppop.com.au</text></g><g transform="translate(612,538)"><rect width="532" height="330" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="24" y="36" class="m">e-commerce, united kingdom</text><text x="22" y="80" class="s" font-size="34">Beleth Bilash Haat</text><text x="24" y="118" class="s" font-size="18" fill-opacity=".9">Custom Shopify storefront for a UK grocer</text><text x="24" y="144" class="s" font-size="18" fill-opacity=".9">importing deshi produce, seeds and</text><text x="24" y="170" class="s" font-size="18" fill-opacity=".9">handcrafted kitchenware. Bespoke theme.</text><path d="M24 210H168" stroke="#F2B84B" stroke-width="2"/><text x="24" y="248" class="s a" font-size="32">0</text><text x="24" y="270" class="m">templates used</text><path d="M188 210H332" stroke="#F2B84B" stroke-width="2"/><text x="188" y="248" class="s a" font-size="32">1</text><text x="188" y="270" class="m">developer</text><path d="M352 210H496" stroke="#F2B84B" stroke-width="2"/><text x="352" y="248" class="s a" font-size="32">UK</text><text x="352" y="270" class="m">live store</text><path d="M0 290H532" stroke="#8FA9C2" stroke-opacity=".4"/><text x="24" y="314" class="m">Shopify, Liquid, JS, CSS</text><text x="508" y="314" text-anchor="end" class="mp">belethbilash.co.uk</text></g><path d="M56 924H1144" stroke="#8FA9C2" stroke-opacity=".5"/><text x="56" y="976" class="s" font-size="32">Stack</text><text x="58" y="1002" class="m">request path, top to bottom</text><g transform="translate(56,1028)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">edge</text><text x="190" y="27" class="s" font-size="19">Cloudflare</text><text x="1072" y="25" text-anchor="end" class="m"></text></g><path d="M150 1068V1078" stroke="#F2B84B" stroke-width="2"/><g transform="translate(56,1078)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">interface</text><text x="190" y="27" class="s" font-size="19">Next.js, React, TypeScript</text><text x="1072" y="25" text-anchor="end" class="m">Shopify, Liquid, WordPress</text></g><path d="M150 1118V1128" stroke="#F2B84B" stroke-width="2"/><g transform="translate(56,1128)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">api</text><text x="190" y="27" class="s" font-size="19">Node.js, REST</text><text x="1072" y="25" text-anchor="end" class="m">auth, rate limiting, webhooks</text></g><path d="M150 1168V1178" stroke="#F2B84B" stroke-width="2"/><g transform="translate(56,1178)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">data</text><text x="190" y="27" class="s" font-size="19">MySQL</text><text x="1072" y="25" text-anchor="end" class="m">schemas, migrations</text></g><path d="M150 1218V1228" stroke="#F2B84B" stroke-width="2"/><g transform="translate(56,1228)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">money</text><text x="190" y="27" class="s" font-size="19">Stripe</text><text x="1072" y="25" text-anchor="end" class="m">plans, billing, subscriptions</text></g><path d="M150 1268V1278" stroke="#F2B84B" stroke-width="2"/><g transform="translate(56,1278)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">intelligence</text><text x="190" y="27" class="s" font-size="19">LLM pipelines, Python</text><text x="1072" y="25" text-anchor="end" class="m">retrieval, review, evals</text></g><path d="M150 1318V1328" stroke="#F2B84B" stroke-width="2"/><g transform="translate(56,1328)"><rect width="1088" height="40" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".7"/><text x="16" y="25" class="m">runtime</text><text x="190" y="27" class="s" font-size="19">Docker</text><text x="1072" y="25" text-anchor="end" class="m">deploy and hand over</text></g><path d="M56 1424H1144" stroke="#8FA9C2" stroke-opacity=".5"/><text x="56" y="1476" class="s" font-size="32">How I work</text><text x="58" y="1502" class="m">four steps, working software early</text><path d="M70 1554H1144" stroke="#8FA9C2" stroke-opacity=".6"/><circle cx="70" cy="1554" r="14" fill="#0F2A44" stroke="#F2B84B" stroke-width="2"/><text x="70" y="1559" text-anchor="middle" class="mp a">1</text><text x="56" y="1606" class="s" font-size="20">Understand the work</text><text x="56" y="1634" class="m">Sit with whoever does it today.</text><text x="56" y="1654" class="m">Find where the data lives.</text><circle cx="342" cy="1554" r="14" fill="#0F2A44" stroke="#F2B84B" stroke-width="2"/><text x="342" y="1559" text-anchor="middle" class="mp a">2</text><text x="328" y="1606" class="s" font-size="20">Model it properly</text><text x="328" y="1634" class="m">The schema is the product.</text><text x="328" y="1654" class="m">No rewrite eighteen months on.</text><circle cx="614" cy="1554" r="14" fill="#0F2A44" stroke="#F2B84B" stroke-width="2"/><text x="614" y="1559" text-anchor="middle" class="mp a">3</text><text x="600" y="1606" class="s" font-size="20">Ship in increments</text><text x="600" y="1634" class="m">Something usable early,</text><text x="600" y="1654" class="m">then real feedback.</text><circle cx="886" cy="1554" r="14" fill="#0F2A44" stroke="#F2B84B" stroke-width="2"/><text x="886" y="1559" text-anchor="middle" class="mp a">4</text><text x="872" y="1606" class="s" font-size="20">Hand over</text><text x="872" y="1634" class="m">Docs, access and a system</text><text x="872" y="1654" class="m">you can maintain yourself.</text><g transform="translate(948,1690)"><rect width="228" height="30" fill="#0F2A44" stroke="#8FA9C2" stroke-opacity=".55"/><path d="M150 0V30" stroke="#8FA9C2" stroke-opacity=".55"/><text x="10" y="20" class="m">rb / profile</text><text x="160" y="20" class="m">2026</text></g></svg>