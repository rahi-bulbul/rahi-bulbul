name: Update profile stats
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/stats.mjs", ".github/workflows/stats.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/stats.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/activity.svg
          git diff --cached --quiet || (git commit -m "Update profile stats" && git push)
